name: cineflix_flutter
description: Netflix-inspired Flutter movie catalog UI for Task 1 (without page navigation).
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/offline_posters/
    - assets/posters/
    - assets/featured/
